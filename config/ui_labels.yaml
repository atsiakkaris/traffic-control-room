# UI Labels — edit these to rename things in the report without touching Python code.

# ── Page title (shown in browser tab and header) ─────────────────────────────
page_title: "ITS Infrastructure Health"

# ── Panel headings ────────────────────────────────────────────────────────────
panels:
  groups:       "System Overview"
  map:          "Sensor map"
  health_trend: "Sensors health trend"
  stability:    "Sensor stability"
  history:      "Run history"

# ── Run history table column headers ─────────────────────────────────────────
history_columns:
  time:         "Time (EET)"
  td:           "Traffic Detection"
  vms:          "VMS"
  bt:           "Bluetooth Paths"
  api_response: "API response"

# ── Group display names (DB name on left, label shown in UI on right) ─────────
# The DB names must stay exactly as-is — only change the values on the right.
group_display:
  Traffic Detection: "Traffic Detection (SWARCO)"
  Bluetooth:         "Bluetooth"
  VMS:               "VMS"

# ── Map layer toggle button labels ────────────────────────────────────────────
map_layers:
  td:    "Traffic Detection (SWARCO)"
  bt:    "Bluetooth Sensors"
  vms:   "VMS"
  paths: "Bluetooth Paths"

# ─────────────────────────────────────────────────────────────────────────────
# endpoints.yaml  –  SWARCO API test definitions
#
# HOW TO ADD A NEW ENDPOINT:
#   1. Add a new entry under the appropriate group (or create a new group).
#   2. Set `path` to the URL suffix after {{swarco}} (e.g. MyNewEndpoint).
#   3. Optionally set `expected_status`, `max_response_ms`, and `checks`.
#   4. For live endpoints that track per-sensor health, set:
#        health_check: <check_name>   — the check that produces the health %
#   5. If sensor results should be stored under a different group name than the
#      parent group (e.g. Bluetooth Paths vs Bluetooth), set:
#        sensor_group: "Other Name"
#   6. For inventory endpoints that provide sensor coordinates, set:
#        coords_extract: measurement_site   — for loop/BT sensor sites (lat/lon + name)
#        coords_extract: vms               — for VMS controllers
#        coords_extract: bt_paths          — for predefined BT path polylines
#   7. Add a matching block under `groups:` in config/ui_labels.yaml.
#   8. Commit and push — the next scheduled run will pick it up automatically.
#
# VARIABLES (set as GitHub Secrets → passed as env vars at runtime):
#   BASE_URL  – e.g. https://datex.example.com/
#   SWARCO    – e.g. swarco/
# ─────────────────────────────────────────────────────────────────────────────

groups:

  - name: VMS
    description: Variable Message Signs installed on the road network.
    endpoints:

      - name: VMS Inventory
        path: VmsTablePublication
        expected_status: 200
        max_response_ms: 5000
        coords_extract: vms
        checks:
          - valid_xml

      - name: VMS Live Data
        path: VmsPublication
        expected_status: 200
        max_response_ms: 5000
        health_check: vms_controller_status
        checks:
          - valid_xml
          - feed_freshness          # publicationTime must be within freshness_minutes
          - vms_controller_status   # parses working / not-working / no-status controllers

  - name: Bluetooth
    description: Bluetooth devices installed on the road network.
    endpoints:

      - name: Bluetooth Inventory
        path: BTMeasurementSiteTablePublication
        expected_status: 200
        max_response_ms: 5000
        coords_extract: measurement_site
        checks:
          - valid_xml
          - bt_site_count   # counts measurementSite elements → shown in report

      - name: Bluetooth Paths Inventory
        path: PredefinedLocationPublication
        expected_status: 200
        max_response_ms: 5000
        coords_extract: bt_paths
        checks:
          - valid_xml
          - predefined_paths_count   # asserts at least 1 predefined path exists

      - name: Bluetooth Paths Live (FCD)
        path: PredefinedLocationDataPublication
        expected_status: 200
        max_response_ms: 30000
        sensor_group: "Bluetooth Paths"   # results stored under this group, not "Bluetooth"
        health_check: bt_paths_speed_and_traveltime
        checks:
          - valid_xml
          - feed_freshness                  # publicationTime must be within freshness_minutes
          - bt_paths_speed_and_traveltime   # all paths must have speed>0 and traveltime>0

  - name: Traffic Detection
    description: Urban Traffic Counter Loop sensors on the road network.
    endpoints:

      - name: Traffic Detection Inventory
        path: TrafficMeasurementSiteTablePublication
        expected_status: 200
        max_response_ms: 5000
        coords_extract: measurement_site
        checks:
          - valid_xml

      - name: Traffic Detection Live
        path: MeasuredDataPublication
        expected_status: 200
        max_response_ms: 5000
        health_check: sensor_speed_status
        checks:
          - valid_xml
          - feed_freshness        # publicationTime must be within freshness_minutes
          - sensor_speed_status   # categorises sensors: working / malfunctioning / no-measurement
